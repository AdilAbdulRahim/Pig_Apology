<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
        <title>Apology Piggy Bank</title>
        <style>
            :root {
                --pig-size: min(500px, 82vw, calc(100svh - 260px));
            }

            body {
                margin: 0;
                min-height: 100svh;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;

                background-color: #ffe6f0;
                overflow: hidden;

                padding: clamp(12px, 3vw, 20px);
                box-sizing: border-box;
            }
            .header{
                position: fixed;
                top: 0;
                left: 0;

                width: 100%;

                display: flex;
                justify-content: center;

                padding-top: clamp(8px, 2.5vw, 20px);

                z-index: 999;
                pointer-events: none;
            }
            .title {
                user-select: none;
                -webkit-user-select: none;
                -ms-user-select: none;

                font-family: "Poppins", sans-serif;
                font-size: clamp(30px, 7vw, 64px);
                font-weight: 700;
                color: #2b2b2b;

                margin-top: clamp(8px, 2vw, 30px);
                margin-bottom: 10px;
                max-width: calc(100vw - 24px);
                text-align: center;
                line-height: 1.05;

                letter-spacing: 0;
                text-transform: uppercase;

                text-shadow: 2px 2px 0px rgba(0,0,0,0.08);

                background: linear-gradient(90deg, #ff4d6d, #ff8fa3);

                -webkit-background-clip: text;
                background-clip: text;

                -webkit-text-fill-color: transparent;
            }
            .scoreboard {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 4px;
                flex-wrap: wrap;

                padding: 0;
                background-color: transparent;

                font-family: "Poppins", sans-serif;
                user-select: none;
            }

            .score-label {
                font-size: clamp(26px, 7vw, 34px);
                font-weight: 700;
                line-height: 1;
                color: #2b2b2b;
                text-transform: uppercase;
                letter-spacing: 0;
            }

            .score-value {
                text-shadow: none;
                font-family: "Sora", sans-serif;
                font-size: clamp(26px, 7vw, 34px);
                font-weight: 800;
                font-variant-numeric: tabular-nums;
                line-height: 1;

                color: #ff4d6d;

                margin: 0;
                min-width: 0;
                text-align: left;

                pointer-events: none;
                user-select: none;

                white-space: nowrap;
            }

            .pig-wrapper{
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                width: var(--pig-size);
                height: var(--pig-size);
            }
            .pig-container {
                position: relative;
                display: inline-block;
                
                cursor: pointer;
                user-select: none;
                transition: transform 0.2s ease;
                transform: scale(1.02);
            }
            .pig-frame {
                width: var(--pig-size);
                aspect-ratio: 1 / 1;

                display: flex;
                align-items: center;
                justify-content: center;

                overflow: hidden;

                position: relative;
                z-index: 2;
            }

            #piggy{
                -webkit-user-drag: none;
                width: var(--pig-size);
                height: auto;
                display: block;

                transition: opacity 0.15s ease;
            }

            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
            }

            button {
                border: none;
                cursor: pointer;
            }

            .hidden {
                display: none;
            }
            #undoBtn,
            #resetBtn {
                font-size: 13px;
                color: white;
                border-radius: 8px;
                opacity: 0.9;
            }
            #undoBtn:hover,
            #resetBtn:hover {
                opacity: 1;
            }

            .app{
                margin-top: clamp(115px, 22vh, 155px);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: clamp(12px, 3vh, 20px);

                width: 100%;
                max-width: 900px;
            }

            #undoBtn:disabled {
                background-color: #bdbdbd;
                cursor: not-allowed;
                opacity: 0.6;
            }
            
            #undoBtn{
                padding: 8px 14px;
                background-color: #e53935;
            }

            #resetBtn {
                padding: 8px 12px;
                background-color: #607d8b;
            }

            @media (max-height: 620px) {
                :root {
                    --pig-size: min(380px, 76vw, calc(100svh - 245px));
                }

                .header {
                    padding-top: 6px;
                }

                .title {
                    font-size: clamp(26px, 8vh, 36px);
                    margin-top: 4px;
                }

                .app {
                    margin-top: 95px;
                }
            }

            @media (max-width: 900px) {
            }

            @media (max-width: 380px) {

                .scoreboard {
                    gap: 2px 6px;
                }

                .score-label,
                .score-value {
                    font-size: 25px;
                }
            }

        </style>
    </head>
    <body>
        <audio id="coinSound" preload="auto">
            <source src="coin.m4a" type="audio/mp4">
            <source src="coin.mp3" type="audio/mpeg">
        </audio>
        <div class="header">
            <h1 class="title">Apology Piggy Bank</h1>
        </div>
        <div class="app">
            <div class="scoreboard" aria-label="Score board">
                <span class="score-label">Score</span>
                <h2 class="score-value" id="money">0</h2>
            </div>
            <div class="pig-wrapper">
                <div class ="pig-container">
                    <div class="pig-frame">
                        <img id="piggy" src="piggy.png" alt="Piggy Bank">
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="undoBtn">Undo</button>
                <button id="resetBtn">&#8634;</button>
            </div>
        </div>   

        <script>
            const moneyDisplay = document.getElementById("money");
            const undoBtn = document.getElementById("undoBtn");
            const resetBtn = document.getElementById("resetBtn");
            const pigContainer = document.querySelector(".pig-container");
            const piggy = document.getElementById("piggy");
            const sound = document.getElementById("coinSound");
            const maxMoney = 25;
            let money = Number(localStorage.getItem("money")) || 0;
            let history = JSON.parse(localStorage.getItem("history") || "null") || [money];

            pigContainer.addEventListener("click", addMoney);
            undoBtn.addEventListener("click", undo);
            resetBtn.addEventListener("click", resetAll);
            renderState();

            function addMoney() {
                money += 1;
                history.push(money);
                saveState();
                renderState();
                pigContainer.style.transform = "scale(1.08)";
                setTimeout(() => pigContainer.style.transform = "scale(1)", 150);
                piggy.src = "piggy-no-coin.png";
                setTimeout(() => piggy.src = "piggy.png", 250);
                playSound();
            }

            function undo() {
                if(history.length <= 1) return;
                history.pop();
                money = history[history.length - 1];
                saveState();
                renderState();
            }

            function resetAll() {
                money = 0;
                history = [0];
                saveState();
                renderState();
            }

            function saveState() {
                localStorage.setItem("money", String(money));
                localStorage.setItem("history", JSON.stringify(history));
            }

            function renderState() {
                moneyDisplay.innerText = String(Math.round(money));
                undoBtn.disabled = history.length <= 1;
            }

            function playSound() {
                sound.pause();
                sound.currentTime = 0;
                sound.volume = Math.min(money / maxMoney, 1);
                const promise = sound.play();
                if(promise !== undefined) promise.catch(() => {});
            }
        </script>
    </body>
</html>
