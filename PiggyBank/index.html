<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
        <title>Apology Piggy Bank</title>
        <style>
            :root {
                --pig-size: min(500px, 82vw, calc(100svh - 260px));
            }

            body {
                margin: 0;
                min-height: 100svh;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;

                background-color: #ffe6f0;
                overflow: hidden;

                padding: clamp(12px, 3vw, 20px);
                box-sizing: border-box;
            }
            .header{
                position: fixed;
                top: 0;
                left: 0;

                width: 100%;

                display: flex;
                justify-content: center;

                padding-top: clamp(8px, 2.5vw, 20px);

                z-index: 999;
                pointer-events: none;
            }
            .title {
                user-select: none;
                -webkit-user-select: none;
                -ms-user-select: none;

                font-family: "Poppins", sans-serif;
                font-size: clamp(30px, 7vw, 64px);
                font-weight: 700;
                color: #2b2b2b;

                margin-top: clamp(8px, 2vw, 30px);
                margin-bottom: 10px;
                max-width: calc(100vw - 24px);
                text-align: center;
                line-height: 1.05;

                letter-spacing: 0;
                text-transform: uppercase;

                text-shadow: 2px 2px 0px rgba(0,0,0,0.08);

                background: linear-gradient(90deg, #ff4d6d, #ff8fa3);

                -webkit-background-clip: text;
                background-clip: text;

                -webkit-text-fill-color: transparent;
            }
            .scoreboard {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 4px;
                flex-wrap: wrap;

                padding: 0;
                background-color: transparent;

                font-family: "Poppins", sans-serif;
                user-select: none;
            }

            .score-label {
                font-size: clamp(26px, 7vw, 34px);
                font-weight: 700;
                line-height: 1;
                color: #2b2b2b;
                text-transform: uppercase;
                letter-spacing: 0;
            }

            .score-value {
                text-shadow: none;
                font-family: "Sora", sans-serif;
                font-size: clamp(26px, 7vw, 34px);
                font-weight: 800;
                font-variant-numeric: tabular-nums;
                line-height: 1;

                color: #ff4d6d;

                margin: 0;
                min-width: 0;
                text-align: left;

                pointer-events: none;
                user-select: none;

                white-space: nowrap;
            }

            .friend-scoreboard {
                position: fixed;
                top: 50%;
                left: clamp(12px, 4vw, 32px);
                transform: translateY(-50%);

                display: flex;
                flex-direction: column;
                gap: 10px;

                min-width: 150px;
                padding: 14px 16px;
                border-radius: 8px;
                background-color: rgba(255, 230, 240, 0.78);

                font-family: "Poppins", sans-serif;
                user-select: none;
                z-index: 900;
            }

            .friend-scoreboard-title {
                margin: 0 0 2px;
                font-size: 13px;
                font-weight: 700;
                line-height: 1;
                color: #2b2b2b;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .friend-score-row {
                display: grid;
                grid-template-columns: 1fr auto;
                align-items: center;
                gap: 18px;
            }

            .friend-score-name {
                font-size: 16px;
                font-weight: 700;
                color: #2b2b2b;
            }

            .friend-score-value {
                font-family: "Sora", sans-serif;
                font-size: 22px;
                font-weight: 800;
                font-variant-numeric: tabular-nums;
                color: #ff4d6d;
            }

            .pig-wrapper{
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                width: var(--pig-size);
                height: var(--pig-size);
            }
            .pig-container {
                position: relative;
                display: inline-block;
                
                cursor: pointer;
                user-select: none;
                transition: transform 0.2s ease;
                transform: scale(1.02);
            }
            .pig-frame {
                width: var(--pig-size);
                aspect-ratio: 1 / 1;

                display: flex;
                align-items: center;
                justify-content: center;

                overflow: hidden;

                position: relative;
                z-index: 2;
            }

            #piggy{
                -webkit-user-drag: none;
                width: var(--pig-size);
                height: auto;
                display: block;

                transition: opacity 0.15s ease;
            }

            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
            }

            button {
                border: none;
                cursor: pointer;
            }

            .hidden {
                display: none;
            }

             #undoBtn,
            #resetBtn,
            #saveNameBtn {
                font-size: 13px;
                color: white;
                border-radius: 8px;
                opacity: 0.9;
            }

             #undoBtn:hover,
            #resetBtn:hover,
            #saveNameBtn:hover {
                opacity: 1;
            }

            .app{
                margin-top: clamp(115px, 22vh, 155px);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: clamp(12px, 3vh, 20px);

                width: 100%;
                max-width: 900px;
            }

            #undoBtn:disabled {
                background-color: #bdbdbd;
                cursor: not-allowed;
                opacity: 0.6;
            }
            
            #undoBtn{
                padding: 8px 14px;
                background-color: #e53935;
            }

            #resetBtn {
                padding: 8px 12px;
                background-color: #607d8b;
            }

            .name-panel {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 8px;

                max-width: min(420px, calc(100vw - 24px));
                font-family: "Poppins", sans-serif;
            }

            .name-panel.hidden {
                display: none;
            }

            .name-panel input {
                min-height: 32px;
                padding: 6px 8px;
                border: 1px solid rgba(255, 77, 109, 0.28);
                border-radius: 8px;
                background-color: rgba(255, 255, 255, 0.62);
                color: #2b2b2b;
                font-family: "Poppins", sans-serif;
                font-size: 13px;
                box-sizing: border-box;
            }

            .firebase-status {
                flex-basis: 100%;
                margin: 0;
                color: #2b2b2b;
                font-size: 12px;
                line-height: 1.25;
                text-align: center;
            }

            @media (max-height: 620px) {
                :root {
                    --pig-size: min(380px, 76vw, calc(100svh - 245px));
                }

                .header {
                    padding-top: 6px;
                }

                .title {
                    font-size: clamp(26px, 8vh, 36px);
                    margin-top: 4px;
                }

                .app {
                    margin-top: 95px;
                }

                .friend-scoreboard {
                    top: 86px;
                }
            }

            @media (max-width: 900px) {
                .friend-scoreboard {
                    position: fixed;
                    left: 10px;
                    top: 132px;
                    transform: none;
                    width: auto;
                    min-width: 0;
                    box-sizing: border-box;
                    gap: 3px;
                    padding: 0;
                    background-color: transparent;
                }

                .friend-scoreboard-title {
                    display: none;
                }

                .friend-score-row {
                    gap: 8px;
                }

                .friend-score-name {
                    font-size: 12px;
                }

                .friend-score-value {
                    font-size: 14px;
                }
            }

            @media (max-width: 380px) {
                .friend-scoreboard {
                    top: 116px;
                }

                .scoreboard {
                    gap: 2px 6px;
                }

                .score-label,
                .score-value {
                    font-size: 25px;
                }
            }

        </style>
    </head>
    <body>
        <audio id="coinSound" preload="auto">
            <source src="coin.m4a" type="audio/mp4">
            <source src="coin.mp3" type="audio/mpeg">
        </audio>
        <div class="header">
            <h1 class="title">Apology Piggy Bank</h1>
        </div>
        <aside class="friend-scoreboard" aria-label="Friends scoreboard">
            <h2 class="friend-scoreboard-title">Scoreboard</h2>
            <div id="friendScores"></div>
        </aside>
        <div class="app">
            <div class="scoreboard" aria-label="Score board">
                <span class="score-label">Score</span>
                <h2 class="score-value" id="money">0</h2>
            </div>
            <div class="pig-wrapper">
                <div class ="pig-container">
                    <div class="pig-frame">
                        <img id="piggy" src="piggy.png" alt="Piggy Bank">
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="undoBtn">Undo</button>
                <button id="resetBtn">&#8634;</button>
            </div>
            <div class="name-panel" id="namePanel">
                <input id="playerName" maxlength="24" aria-label="Your scoreboard name" placeholder="Your name">
                <button id="saveNameBtn" type="button">Save name</button>
                <p class="firebase-status" id="firebaseStatus"></p>
            </div>
        </div>   

        <script type="module">
           import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
           import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
           import { collection, doc, getDoc, getFirestore, onSnapshot, serverTimestamp, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

           const firebaseConfig = {
            apiKey: "AIzaSyBng6n-pUWMGsbyTcrVFtIBAXLi_acpPM0",
            authDomain: "piggy-bank-d64b3.firebaseapp.com",
            projectId: "piggy-bank-d64b3",
            storageBucket: "piggy-bank-d64b3.firebasestorage.app",
            messagingSenderId: "872269180934",
            appId: "1:872269180934:web:eb3931fb866c21f2d41387"
           };
           const moneyDisplay = document.getElementById("money");
           const friendScores = document.getElementById("friendScores");
           const undoBtn = document.getElementById("undoBtn");
           const resetBtn = document.getElementById("resetBtn");
           const playerName = document.getElementById("playerName");
           const saveNameBtn = document.getElementById("saveNameBtn");
           const firebaseStatus = document.getElementById("firebaseStatus");
           const pigContainer = document.querySelector(".pig-container");
           const piggy = document.getElementById("piggy");
           const sound = document.getElementById("coinSound");
           const maxMoney = 25;
           let db, user, activePlayer = "", scores = {}, money = 0, history = [0], firebaseReady = false;

           renderState();
           pigContainer.addEventListener("click", addMoney);
           undoBtn.addEventListener("click", undo);
           resetBtn.addEventListener("click", resetAll);
           saveNameBtn.addEventListener("click", saveName);
           startFirebase();

           async function startFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                db = getFirestore(app);
                user = (await signInAnonymously(auth)).user;
                activePlayer = user.uid;
                const playerRef = doc(db, "games", "piggyBank", "players", activePlayer);
                await setDoc(playerRef, { name: "Bob", score: 0, updatedAt: serverTimestamp() }, { merge: true });
                firebaseReady = true;
                playerName.value = "Bob";
                setStatus("Choose a name and start playing.");
                onSnapshot(collection(db, "games", "piggyBank", "players"), (snapshot) => {
                    scores = {};
                    snapshot.forEach((item) => scores[item.id] = item.data());
                    renderState();
                }, (error) => setStatus(`Scoreboard error: ${error.message}`));
            } catch(error) {
                setStatus(`Could not connect to the shared scoreboard: ${error.message}`);
            }
           }

           async function saveName() {
            if(!firebaseReady) return setStatus("Connecting to the shared scoreboard?");
            const name = playerName.value.trim().slice(0, 24) || "Bob";
            try {
                await updateDoc(doc(db, "games", "piggyBank", "players", activePlayer), { name, updatedAt: serverTimestamp() });
                playerName.value = name;
                setStatus(`Your scoreboard name is ${name}.`);
            } catch(error) { setStatus(`Could not save name: ${error.message}`); }
           }

           async function addMoney() {
            if(!firebaseReady) return;
            money = (Number(scores[activePlayer]?.score) || 0) + 1;
            try {
                await updateDoc(doc(db, "games", "piggyBank", "players", activePlayer), { score: money, updatedAt: serverTimestamp() });
                history.push(money);
                renderState();
                pigContainer.style.transform = "scale(1.08)";
                setTimeout(() => pigContainer.style.transform = "scale(1)", 150);
                piggy.src = "piggy-no-coin.png";
                setTimeout(() => piggy.src = "piggy.png", 250);
                playSound();
            } catch(error) { setStatus(`Could not update score: ${error.message}`); }
           }

           async function undo() {
            if(history.length <= 1 || !firebaseReady) return;
            history.pop(); money = history[history.length - 1];
            await updateDoc(doc(db, "games", "piggyBank", "players", activePlayer), { score: money, updatedAt: serverTimestamp() });
            renderState();
           }

           async function resetAll() {
            if(!firebaseReady) return;
            money = 0; history = [0];
            await updateDoc(doc(db, "games", "piggyBank", "players", activePlayer), { score: 0, updatedAt: serverTimestamp() });
            renderState();
           }

           function playSound() {
            sound.pause(); sound.currentTime = 0;
            sound.volume = Math.min((Number(scores[activePlayer]?.score) || 0) / maxMoney, 1);
            const promise = sound.play();
            if(promise !== undefined) promise.catch(() => {});
           }

           function renderState() {
            money = Number(scores[activePlayer]?.score) || 0;
            moneyDisplay.innerText = Math.round(money).toString();
            const rows = Object.entries(scores).sort(([idA, a], [idB, b]) => {
                if(idA === activePlayer) return -1;
                if(idB === activePlayer) return 1;
                return String(a.name || "").localeCompare(String(b.name || ""));
            });
            friendScores.replaceChildren(...rows.map(([id, data]) => {
                const row = document.createElement("div"); row.className = "friend-score-row";
                const name = document.createElement("span"); name.className = "friend-score-name";
                name.textContent = `${data.name || "Bob"}${id === activePlayer ? " (you)" : ""}`;
                const value = document.createElement("span"); value.className = "friend-score-value";
                value.textContent = String(Math.round(Number(data.score) || 0));
                row.append(name, value); return row;
            }));
            undoBtn.disabled = history.length <= 1;
           }

           function setStatus(message) { firebaseStatus.innerText = message; }
        </script>
    </body>
</html>
